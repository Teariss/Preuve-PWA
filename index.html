        &lt;div class=&quot;tabs&quot;&gt;
          &lt;button id=&quot;signupTab&quot; class=&quot;active&quot; onclick=&quot;switchMode(&#x27;signup&#x27;)&quot;&gt;Inscription&lt;/button&gt;
          &lt;button id=&quot;loginTab&quot; onclick=&quot;switchMode(&#x27;login&#x27;)&quot;&gt;Connexion&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;form&quot;&gt;

          &lt;/div&gt;

          &lt;/div&gt;

          &lt;button class=&quot;btn&quot; onclick=&quot;submitForm()&quot;&gt;Continuer&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;success&quot; id=&quot;successBox&quot;&gt;&lt;/div&gt;

        &lt;div class=&quot;note&quot;&gt;

        &lt;/div&gt;

  &lt;script&gt;
    let mode = &#x27;signup&#x27;;

    function updateClock(){
      const d = new Date();
      document.getElementById(&#x27;clock&#x27;).textContent =
        String(d.getHours()).padStart(2,&#x27;0&#x27;) + &#x27;:&#x27; + String(d.getMinutes()).padStart(2,&#x27;0&#x27;);
    }
    updateClock();
    setInterval(updateClock, 1000);

    function switchMode(nextMode){
      mode = nextMode;
      document.getElementById(&#x27;signupTab&#x27;).classList.toggle(&#x27;active&#x27;, nextMode === &#x27;signup&#x27;);
      document.getElementById(&#x27;loginTab&#x27;).classList.toggle(&#x27;active&#x27;, nextMode === &#x27;login&#x27;);
      document.getElementById(&#x27;nameWrap&#x27;).classList.toggle(&#x27;hide&#x27;, nextMode === &#x27;login&#x27;);
      document.getElementById(&#x27;title&#x27;).textContent = nextMode === &#x27;signup&#x27; ? &#x27;Créer un compte&#x27; : &#x27;Se connecter&#x27;;
      document.getElementById(&#x27;subtitle&#x27;).textContent = nextMode === &#x27;signup&#x27;
        ? &#x27;Inscription locale simple pour tester l’application avant le vrai backend.&#x27;
        : &#x27;Connexion locale pour retrouver la session de test.&#x27;;
      document.getElementById(&#x27;successBox&#x27;).style.display = &#x27;none&#x27;;
      document.getElementById(&#x27;successBox&#x27;).textContent = &#x27;&#x27;;
    }

    function getUsers(){
      try{
        return JSON.parse(localStorage.getItem(&#x27;preuve_users&#x27;) || &#x27;[]&#x27;);
      }catch(e){
        return [];
      }
    }

    function saveUsers(users){
      localStorage.setItem(&#x27;preuve_users&#x27;, JSON.stringify(users));
    }

    function submitForm(){
      const name = (document.getElementById(&#x27;name&#x27;).value || &#x27;&#x27;).trim();
      const email = (document.getElementById(&#x27;email&#x27;).value || &#x27;&#x27;).trim().toLowerCase();
      const password = (document.getElementById(&#x27;password&#x27;).value || &#x27;&#x27;).trim();
      const box = document.getElementById(&#x27;successBox&#x27;);

      if(!email || !password){
        alert(&#x27;Renseigne ton email et ton mot de passe.&#x27;);
        return;
      }

      const users = getUsers();

      if(mode === &#x27;signup&#x27;){
        if(!name){
          alert(&#x27;Renseigne ton nom complet.&#x27;);
          return;
        }
        if(users.find(u =&gt; u.email === email)){
          alert(&#x27;Un compte existe déjà avec cet email.&#x27;);
          return;
        }

        const user = { name, email, password, plan: &#x27;free&#x27;, created_at: new Date().toISOString() };
        users.push(user);
        saveUsers(users);
        localStorage.setItem(&#x27;preuve_current_user&#x27;, JSON.stringify(user));
        box.textContent = &#x27;Compte créé avec succès. Page 1 validée.&#x27;;
        box.style.display = &#x27;block&#x27;;
      } else {
        const user = users.find(u =&gt; u.email === email &amp;&amp; u.password === password);
        if(!user){
          alert(&#x27;Email ou mot de passe incorrect.&#x27;);
          return;
        }
        localStorage.setItem(&#x27;preuve_current_user&#x27;, JSON.stringify(user));
        box.textContent = &#x27;Connexion réussie. Page 1 validée.&#x27;;
        box.style.display = &#x27;block&#x27;;
      }
    }
  &lt;/script&gt;

    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:22px;color:#04111f;
      background:linear-gradient(145deg,#84d8ff,#4da3ff 48%,#2d6eff);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 10px 30px rgba(77,163,255,.35), 0 0 24px rgba(77,163,255,.22);
      position:relative;overflow:hidden;
    }
    .logo::after{
      content:&quot;&quot;;position:absolute;top:-30%;left:-120%;width:80%;height:160%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
      transform:skewX(-20deg);animation:logoShine 2.8s linear infinite;
    }
    @keyframes logoShine{0%{left:-120%}100%{left:140%}}
    .brand strong{display:block;font-size:18px}
    .brand .slogan{font-size:12px;color:var(--muted);margin-top:2px}
    .ghost-pill{
      padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);
      border:1px solid var(--line);color:#cad3e6;font-size:12px;font-weight:700;
    }
    .progress-card,.step{
      margin-top:14px;padding:16px;border-radius:28px;
      background:linear-gradient(180deg, var(--card1), var(--card2));
      border:1px solid var(--line);box-shadow:0 18px 55px rgba(0,0,0,.22);
      animation:cardShow .55s ease forwards;
    }
    @keyframes cardShow{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .progress-title{font-weight:700}
    .small{font-size:13px;color:var(--muted)}
    .progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
    .bar.active::after{content:&quot;&quot;;position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,#4da3ff,#6ee7ff)}
    .step h2{margin:0 0 6px;font-size:24px}
    .muted{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45}
    .grid{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:12px;font-weight:700;color:#cfd6e7;margin:0 0 7px}
    input,textarea{
      width:100%;padding:15px;border-radius:18px;border:1px solid var(--line2);
      background:rgba(255,255,255,.04);color:var(--text);font-size:15px;outline:none;
    }
    input::placeholder,textarea::placeholder{color:#7f889d}
    textarea{min-height:118px;resize:none}
    .primary,.secondary{
      width:100%;border:none;border-radius:18px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer;
      position:relative;overflow:hidden;
    }
    .primary{color:#07111d;background:linear-gradient(135deg,#eef7ff,#8ad8ff 35%, #4da3ff 72%);box-shadow:0 16px 28px rgba(77,163,255,.24)}
    .secondary{margin-top:10px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line)}
    .sig-card{padding:14px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
    .sig-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .link-btn{border:none;background:none;padding:0;color:#8bc3ff;font-weight:700;font-size:13px}
    canvas{width:100%;height:132px;display:block;border-radius:18px;background:#ffffff;border:1px dashed rgba(0,0,0,.12)}
    .success{text-align:center;padding-top:24px}
    .badge{
      width:76px;height:76px;margin:0 auto 14px;border-radius:999px;display:grid;place-items:center;
      background:linear-gradient(180deg,#55ec98,#31d17c);color:#06120b;font-size:32px;font-weight:900;
      box-shadow:0 16px 34px rgba(49,209,124,.22)
    }
    .proof-card{
      margin-top:16px;padding:16px;border-radius:24px;background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.025));
      border:1px solid var(--line);text-align:left;
    }
    .proof-row{
      display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);align-items:start;
    }
    .proof-row:last-child{border-bottom:none}
    .proof-label{color:var(--muted);font-weight:600}
    .proof-value{font-weight:700;text-align:right;word-break:break-word}
    .proof-value.multiline{text-align:left;line-height:1.5;font-weight:600}
    .signatures-grid,.photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
    .sig-preview-card,.photo-card{
      border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03);padding:10px
    }
    .sig-preview-title,.photo-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
    .sig-preview,.photo-preview{
      width:100%;height:88px;object-fit:cover;border-radius:14px;background:#fff
    }
    .footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 8px}
    .hide{display:none}
    .loc-box,.upload-box{
      padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
    }
    .loc-status{font-size:13px;color:#cfd6e7;margin-top:8px;line-height:1.4}
    .file-input{padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--line2)}
  
    .validation-box{
      margin-top:14px;padding:14px;border-radius:18px;
      background:rgba(255,255,255,.03);border:1px solid var(--line);
      text-align:left;
    }
    .validation-status{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800;
      margin-bottom:10px;
    }
    .validation-status.pending{background:rgba(255,184,77,.14);color:#ffd38a;border:1px solid rgba(255,184,77,.22)}
    .validation-status.confirmed{background:rgba(49,209,124,.14);color:#8cf0b4;border:1px solid rgba(49,209,124,.22)}

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;app&quot;&gt;
    &lt;div class=&quot;status&quot;&gt;
      &lt;div id=&quot;clock&quot;&gt;00:00&lt;/div&gt;
      &lt;div&gt;PREUVE&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;device&quot;&gt;
      &lt;div class=&quot;topbar&quot;&gt;
        &lt;div class=&quot;brand&quot;&gt;
          &lt;div class=&quot;logo&quot;&gt;P&lt;/div&gt;
          &lt;div&gt;
            &lt;strong&gt;PREUVE&lt;/strong&gt;
            &lt;div class=&quot;slogan&quot;&gt;Engagé. Vérifié. Incontestable.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;ghost-pill&quot;&gt;Sécurisé&lt;/div&gt;
      &lt;/div&gt;

      &lt;section class=&quot;progress-card&quot;&gt;
        &lt;div class=&quot;progress-top&quot;&gt;
          &lt;div class=&quot;progress-title&quot;&gt;Créer une preuve&lt;/div&gt;
          &lt;div class=&quot;small&quot;&gt;5 étapes&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;progress&quot;&gt;
          &lt;div class=&quot;bar active&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;step&quot; id=&quot;step1&quot;&gt;
        &lt;h2&gt;L’accord&lt;/h2&gt;
        &lt;p class=&quot;muted&quot;&gt;Décris clairement ce qui est accepté entre les deux parties.&lt;/p&gt;
        &lt;div class=&quot;grid&quot;&gt;
          &lt;div&gt;
            &lt;label&gt;Texte de l’accord&lt;/label&gt;
            &lt;textarea id=&quot;agreement&quot; placeholder=&quot;Exemple : Jean reconnaît devoir 100 € à Léa avant le 20 mai 2026.&quot;&gt;&lt;/textarea&gt;
          &lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;div&gt;
              &lt;label&gt;Montant&lt;/label&gt;
              &lt;input id=&quot;amount&quot; placeholder=&quot;100 €&quot; /&gt;
            &lt;/div&gt;
            &lt;div&gt;
              &lt;label&gt;Date limite&lt;/label&gt;
              &lt;input id=&quot;deadline&quot; placeholder=&quot;20/05/2026&quot; /&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;button class=&quot;primary&quot; onclick=&quot;goStep(2)&quot;&gt;Continuer&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;step hide&quot; id=&quot;step2&quot;&gt;
        &lt;h2&gt;Les parties&lt;/h2&gt;
        &lt;p class=&quot;muted&quot;&gt;Ajoute les noms et les numéros de téléphone.&lt;/p&gt;
        &lt;div class=&quot;grid&quot;&gt;
          &lt;div&gt;
              &lt;label&gt;Partie 1&lt;/label&gt;
              &lt;input id=&quot;p1&quot; placeholder=&quot;Nom complet&quot; /&gt;
          &lt;/div&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;div&gt;
              &lt;label&gt;Partie 2&lt;/label&gt;
              &lt;input id=&quot;p2&quot; placeholder=&quot;Nom complet&quot; /&gt;
            &lt;/div&gt;
            &lt;div&gt;
              &lt;label&gt;Téléphone&lt;/label&gt;
              &lt;input id=&quot;phone2&quot; placeholder=&quot;+33612345678&quot; /&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;label&gt;Ton numéro pour recevoir la réponse SMS&lt;/label&gt;
            &lt;input id=&quot;ownerPhone&quot; placeholder=&quot;+33612345678&quot; /&gt;
          &lt;/div&gt;
          &lt;button class=&quot;primary&quot; onclick=&quot;goStep(3)&quot;&gt;Ajouter preuves visuelles&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;step hide&quot; id=&quot;step3&quot;&gt;
        &lt;h2&gt;Photos &amp; ville&lt;/h2&gt;
        &lt;p class=&quot;muted&quot;&gt;Ajoute des photos et indique la ville de l’accord.&lt;/p&gt;
        &lt;div class=&quot;grid&quot;&gt;
          &lt;div class=&quot;upload-box&quot;&gt;
            &lt;label&gt;Photos de preuve&lt;/label&gt;
            &lt;input id=&quot;photoInput&quot; class=&quot;file-input&quot; type=&quot;file&quot; accept=&quot;image/*&quot; multiple /&gt;
            &lt;div id=&quot;photoStatus&quot; class=&quot;loc-status&quot;&gt;Aucune photo ajoutée&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;loc-box&quot;&gt;
            &lt;label&gt;Ville&lt;/label&gt;
            &lt;input id=&quot;city&quot; placeholder=&quot;Ex : Nancy&quot; /&gt;
          &lt;/div&gt;

          &lt;button class=&quot;primary&quot; onclick=&quot;goStep(4)&quot;&gt;Passer aux signatures&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;step hide&quot; id=&quot;step4&quot;&gt;
        &lt;h2&gt;Les signatures&lt;/h2&gt;
        &lt;p class=&quot;muted&quot;&gt;Les deux signatures sont obligatoires.&lt;/p&gt;
        &lt;div class=&quot;grid&quot;&gt;
          &lt;div class=&quot;sig-card&quot;&gt;
            &lt;div class=&quot;sig-meta&quot;&gt;
              &lt;strong id=&quot;sig1name&quot;&gt;Partie 1&lt;/strong&gt;
              &lt;button class=&quot;link-btn&quot; onclick=&quot;clearCanvas(&#x27;sig1&#x27;)&quot;&gt;Effacer&lt;/button&gt;
            &lt;/div&gt;
            &lt;canvas id=&quot;sig1&quot; width=&quot;360&quot; height=&quot;132&quot;&gt;&lt;/canvas&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sig-card&quot;&gt;
            &lt;div class=&quot;sig-meta&quot;&gt;
              &lt;strong id=&quot;sig2name&quot;&gt;Partie 2&lt;/strong&gt;
              &lt;button class=&quot;link-btn&quot; onclick=&quot;clearCanvas(&#x27;sig2&#x27;)&quot;&gt;Effacer&lt;/button&gt;
            &lt;/div&gt;
            &lt;canvas id=&quot;sig2&quot; width=&quot;360&quot; height=&quot;132&quot;&gt;&lt;/canvas&gt;
          &lt;/div&gt;
          &lt;button class=&quot;primary&quot; onclick=&quot;finalizeProof()&quot;&gt;Finaliser la preuve&lt;/button&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;step hide success&quot; id=&quot;step5&quot;&gt;
        &lt;div class=&quot;badge&quot;&gt;✓&lt;/div&gt;
        &lt;h2 style=&quot;margin-bottom:6px&quot;&gt;Preuve validée&lt;/h2&gt;
        &lt;p class=&quot;muted&quot; style=&quot;max-width:312px;margin:0 auto&quot;&gt;La fiche finale regroupe les informations utiles, les photos, la localisation et les signatures.&lt;/p&gt;

        &lt;div class=&quot;proof-card&quot;&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Référence&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;ref&quot;&gt;PR-2026-1042&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Horodatage&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;stamp&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Partie 1&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;outP1&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Partie 2&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;outP2&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Accord&lt;/div&gt;&lt;div class=&quot;proof-value multiline&quot; id=&quot;outAgreement&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Montant&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;outAmount&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Date limite&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;outDeadline&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Ville&lt;/div&gt;&lt;div class=&quot;proof-value multiline&quot; id=&quot;outLocation&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;proof-row&quot;&gt;&lt;div class=&quot;proof-label&quot;&gt;Validation SMS&lt;/div&gt;&lt;div class=&quot;proof-value&quot; id=&quot;outSMSStatus&quot;&gt;En attente&lt;/div&gt;&lt;/div&gt;

          &lt;div class=&quot;proof-row&quot; style=&quot;grid-template-columns:1fr;&quot;&gt;
            &lt;div class=&quot;proof-label&quot; style=&quot;margin-bottom:4px&quot;&gt;Photos&lt;/div&gt;
            &lt;div class=&quot;photos-grid&quot; id=&quot;photosGrid&quot;&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;proof-row&quot; style=&quot;grid-template-columns:1fr;&quot;&gt;
            &lt;div class=&quot;proof-label&quot; style=&quot;margin-bottom:4px&quot;&gt;Signatures&lt;/div&gt;
            &lt;div class=&quot;signatures-grid&quot;&gt;
              &lt;div class=&quot;sig-preview-card&quot;&gt;
                &lt;div class=&quot;sig-preview-title&quot; id=&quot;sigPrev1Title&quot;&gt;Partie 1&lt;/div&gt;
                &lt;img id=&quot;sigPreview1&quot; class=&quot;sig-preview&quot; alt=&quot;Signature 1&quot; /&gt;
              &lt;/div&gt;
              &lt;div class=&quot;sig-preview-card&quot;&gt;
                &lt;div class=&quot;sig-preview-title&quot; id=&quot;sigPrev2Title&quot;&gt;Partie 2&lt;/div&gt;
                &lt;img id=&quot;sigPreview2&quot; class=&quot;sig-preview&quot; alt=&quot;Signature 2&quot; /&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;validation-box&quot;&gt;
          &lt;div id=&quot;smsStatus&quot; class=&quot;validation-status pending&quot;&gt;Validation SMS en attente&lt;/div&gt;
          &lt;div class=&quot;muted&quot; style=&quot;margin-bottom:10px&quot;&gt;Tu envoies le SMS depuis ton propre numéro. L’autre partie doit répondre OUI à ton message.&lt;/div&gt;
          &lt;button class=&quot;primary&quot; onclick=&quot;requestSMSValidation()&quot;&gt;Demander validation par SMS&lt;/button&gt;
          &lt;button class=&quot;secondary&quot; onclick=&quot;markSMSConfirmed()&quot;&gt;Marquer comme validée (réponse reçue)&lt;/button&gt;
        &lt;/div&gt;

        &lt;button class=&quot;primary&quot; style=&quot;margin-top:14px&quot; onclick=&quot;generatePDF()&quot;&gt;Télécharger le PDF&lt;/button&gt;
        &lt;button class=&quot;secondary&quot; onclick=&quot;resetFlow()&quot;&gt;Créer une nouvelle preuve&lt;/button&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;footer&quot;&gt;PREUVE — photos + localisation intégrées&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    let photoData = [];
    let currentLocation = null;
    let smsConfirmed = false;


    function refreshSMSStatus(){
      const label = document.getElementById(&#x27;outSMSStatus&#x27;);
      const badge = document.getElementById(&#x27;smsStatus&#x27;);
      if(!label || !badge) return;
      if(smsConfirmed){
        label.textContent = &#x27;Confirmée&#x27;;
        badge.textContent = &#x27;Validation SMS confirmée&#x27;;
        badge.className = &#x27;validation-status confirmed&#x27;;
      } else {
        label.textContent = &#x27;En attente&#x27;;
        badge.textContent = &#x27;Validation SMS en attente&#x27;;
        badge.className = &#x27;validation-status pending&#x27;;
      }
    }

    function requestSMSValidation(){
      const recipient = document.getElementById(&#x27;phone2&#x27;).value.trim();
      const owner = document.getElementById(&#x27;ownerPhone&#x27;).value.trim();
      const ref = document.getElementById(&#x27;ref&#x27;).textContent.trim();
      const p2 = document.getElementById(&#x27;p2&#x27;).value.trim() || &#x27;la partie 2&#x27;;
      if(!recipient){
        alert(&#x27;Ajoute le téléphone de la partie 2&#x27;);
        return;
      }
      if(!owner){
        alert(&#x27;Ajoute ton numéro pour recevoir la réponse SMS&#x27;);
        return;
      }
      const message =
        &quot;Bonjour &quot; + p2 + &quot;,\n&quot; +
        &quot;Merci de répondre OUI à ce message pour confirmer la preuve &quot; + ref + &quot;.\n&quot; +
        &quot;Réponse attendue au &quot; + owner + &quot;.&quot;;
      window.location.href = &quot;sms:&quot; + recipient + &quot;?body=&quot; + encodeURIComponent(message);
    }

    function markSMSConfirmed(){
      smsConfirmed = true;
      refreshSMSStatus();
    }

    function updateClock(){
      const d = new Date();
      document.getElementById(&#x27;clock&#x27;).textContent =
        String(d.getHours()).padStart(2,&#x27;0&#x27;) + &#x27;:&#x27; + String(d.getMinutes()).padStart(2,&#x27;0&#x27;);
    }
    updateClock(); setInterval(updateClock, 1000);

    function goStep(n){
      for(let i=1;i&lt;=5;i++){
        const el = document.getElementById(&#x27;step&#x27;+i);
        if(el) el.classList.toggle(&#x27;hide&#x27;, i !== n);
      }
      const bars = document.querySelectorAll(&#x27;.bar&#x27;);
      bars.forEach((bar, idx)=&gt;bar.classList.toggle(&#x27;active&#x27;, idx &lt; Math.min(n,5)));
      document.getElementById(&#x27;sig1name&#x27;).textContent = document.getElementById(&#x27;p1&#x27;).value || &#x27;Partie 1&#x27;;
      document.getElementById(&#x27;sig2name&#x27;).textContent = document.getElementById(&#x27;p2&#x27;).value || &#x27;Partie 2&#x27;;
      window.scrollTo({top:0, behavior:&#x27;smooth&#x27;});
    }

    document.getElementById(&#x27;photoInput&#x27;).addEventListener(&#x27;change&#x27;, function(e){
      const files = Array.from(e.target.files || []).slice(0,4);
      photoData = [];
      if(!files.length){
        document.getElementById(&#x27;photoStatus&#x27;).textContent = &#x27;Aucune photo ajoutée&#x27;;
        return;
      }
      let loaded = 0;
      files.forEach(file =&gt; {
        const reader = new FileReader();
        reader.onload = ev =&gt; {
          photoData.push(ev.target.result);
          loaded++;
          document.getElementById(&#x27;photoStatus&#x27;).textContent = loaded + &#x27; photo(s) ajoutée(s)&#x27;;
        };
        reader.readAsDataURL(file);
      });
    });

    function captureLocation_disabled(){
      const status = document.getElementById(&#x27;locationStatus&#x27;);
      if(!navigator.geolocation){
        status.textContent = &quot;La géolocalisation n&#x27;est pas disponible&quot;;
        return;
      }
      status.textContent = &quot;Localisation en cours...&quot;;
      navigator.geolocation.getCurrentPosition(
        pos =&gt; {
          currentLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: Math.round(pos.coords.accuracy)
          };
          status.textContent = `Latitude ${currentLocation.lat.toFixed(6)}, Longitude ${currentLocation.lng.toFixed(6)} (±${currentLocation.accuracy} m)`;
        },
        () =&gt; {
          status.textContent = &quot;Impossible de récupérer la position&quot;;
        },
        {enableHighAccuracy:true, timeout:10000, maximumAge:0}
      );
    }

    function canvasHasDrawing(canvas){
      const ctx = canvas.getContext(&#x27;2d&#x27;);
      const pixels = ctx.getImageData(0,0,canvas.width,canvas.height).data;
      for(let i=3;i&lt;pixels.length;i+=4){ if(pixels[i] !== 0) return true; }
      return false;
    }

    function finalizeProof(){
      const sig1 = document.getElementById(&#x27;sig1&#x27;);

      document.getElementById(&#x27;ref&#x27;).textContent = &#x27;PR-&#x27; + d.getFullYear() + &#x27;-&#x27; + String(Math.floor(Math.random()*9000)+1000);

      document.getElementById(&#x27;outLocation&#x27;).textContent = document.getElementById(&#x27;city&#x27;).value || &#x27;Non renseignée&#x27;;
      smsConfirmed = false;

      document.getElementById(&#x27;sigPrev1Title&#x27;).textContent = document.getElementById(&#x27;p1&#x27;).value || &#x27;Partie 1&#x27;;
      document.getElementById(&#x27;sigPrev2Title&#x27;).textContent = document.getElementById(&#x27;p2&#x27;).value || &#x27;Partie 2&#x27;;

      doc.setFontSize(10); doc.setTextColor(190,198,214); doc.text(&#x27;Engagé. Vérifié. Incontestable.&#x27;, 20, 25);

      y = 46; doc.setTextColor(20,24,32); doc.setFontSize(11);
      [[&quot;Référence&quot;, ref],[&quot;Horodatage&quot;, stamp],[&quot;Partie 1&quot;, p1 + &quot; (&quot; + (document.getElementById(&quot;ownerPhone&quot;).value || &quot;numéro non fourni&quot;) + &quot;)&quot;],[&quot;Partie 2&quot;, p2 + &quot; (&quot; + (document.getElementById(&quot;phone2&quot;).value || &quot;numéro non fourni&quot;) + &quot;)&quot;],[&quot;Montant&quot;, amount],[&quot;Date limite&quot;, deadline],[&quot;Ville&quot;, document.getElementById(&#x27;city&#x27;).value || &#x27;Non renseignée&#x27;],[&quot;Validation SMS&quot;, smsConfirmed ? &#x27;Confirmée&#x27; : &#x27;En attente&#x27;]]

    function setupSignature(id){
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext(&#x27;2d&#x27;);
      ctx.lineWidth = 2; ctx.lineCap = &#x27;round&#x27;; ctx.strokeStyle = &#x27;#1d1d1f&#x27;;
      let drawing = false;
      function getPos(e){
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height) };
      }
      function start(e){ drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
      function move(e){ if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
      function end(){ drawing = false; }
      canvas.addEventListener(&#x27;mousedown&#x27;, start); canvas.addEventListener(&#x27;mousemove&#x27;, move); window.addEventListener(&#x27;mouseup&#x27;, end);

      refreshSMSStatus();

    }

    setupSignature(&#x27;sig1&#x27;); setupSignature(&#x27;sig2&#x27;); goStep(1); refreshSMSStatus();
