<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PREUVE — version avec iframes corrigée</title>
<style>
html,body{margin:0;height:100%;background:#070b14;font-family:-apple-system,Arial,sans-serif}
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:#070b14;display:flex;flex-direction:column}
.viewport{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.screen iframe{width:100%;height:100%;border:none;background:transparent}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px 14px 18px;background:linear-gradient(180deg,rgba(7,11,20,.0),rgba(7,11,20,1) 22%)}
.nav button{border:none;border-radius:14px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;background:rgba(255,255,255,.08);color:#dce7f8}
.nav button.active{color:#07111d;background:linear-gradient(135deg,#e6c77a,#4da3ff 60%)}
.hide{display:none!important}

.logo img{
  width:72%;
  height:72%;
  object-fit:contain;
  display:block;
}
</style>
</head>
<body>
<div class="app">
  <div class="viewport">

&lt;html lang=&quot;fr&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot; /&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0, viewport-fit=cover&quot; /&gt;
  &lt;title&gt;PREUVE — Connexion&lt;/title&gt;
  &lt;style&gt;
    :root{
      --bg1:#070b14;--bg2:#0d1322;--card1:rgba(20,24,36,.96);--card2:rgba(12,15,24,.96);
      --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#9aa5bc;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;height:100%;
      font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;SF Pro Text&quot;,Inter,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(77,163,255,.18), transparent 24%),
        radial-gradient(circle at top right, rgba(143,225,255,.08), transparent 20%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }
    body{display:flex;justify-content:center}
    .app{width:100%;max-width:440px;min-height:100dvh;padding:12px 14px 24px}
    .status{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 14px;font-size:18px;font-weight:800}
    .shell{
      min-height:calc(100dvh - 68px);
      border-radius:34px;padding:14px;
      background:linear-gradient(180deg, rgba(18,20,28,.97), rgba(12,14,20,.97));
      border:1px solid var(--line);box-shadow:0 18px 55px rgba(0,0,0,.42);
      display:flex;flex-direction:column;justify-content:center;
    }
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .logo{
      width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
      font-weight:900;font-size:26px;color:#04111f;
      background:linear-gradient(145deg,#e6c77a,#4da3ff 48%,#2d6eff);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 10px 30px rgba(77,163,255,.25),0 0 24px rgba(200,169,91,.25);
    }
    .brand strong{display:block;font-size:22px}
    .brand span{display:block;font-size:12px;color:var(--muted)}
    .card{
      background:linear-gradient(180deg,var(--card1),var(--card2));
      border:1px solid var(--line);
      border-radius:28px;padding:18px;
      box-shadow:0 18px 55px rgba(0,0,0,.22);
    }
    h1,p{margin:0}
    h1{font-size:30px;letter-spacing:-.03em;margin-bottom:6px}
    .muted{color:var(--muted);font-size:14px;line-height:1.5}
    .tabs{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;
      margin-top:16px;padding:6px;border-radius:18px;
      background:rgba(255,255,255,.03);border:1px solid var(--line);
    }
    .tabs button{
      border:none;background:transparent;color:#dce7f8;padding:12px;
      border-radius:14px;font-weight:800;cursor:pointer;font-size:15px;
    }
    .tabs button.active{
      color:#07111d;background:linear-gradient(135deg,#e6c77a,#4da3ff 60%);
    }
    .form{display:grid;gap:12px;margin-top:16px}
    label{display:block;font-size:12px;font-weight:800;color:#dbe5f4;margin:0 0 7px}
    input{
      width:100%;padding:15px;border-radius:18px;border:1px solid var(--line2);
      background:rgba(255,255,255,.04);color:var(--text);font-size:15px;outline:none;
    }
    input::placeholder{color:#7f889d}
    .btn{
      width:100%;border:none;border-radius:18px;padding:16px 18px;
      font-size:16px;font-weight:800;cursor:pointer;
      color:#07111d;background:linear-gradient(135deg,#e6c77a,#4da3ff 60%);
      box-shadow:0 16px 28px rgba(77,163,255,.24);
    }
    .note{
      margin-top:12px;padding:12px 14px;border-radius:16px;
      background:rgba(255,255,255,.04);border:1px solid var(--line);
      color:#dbe5f4;font-size:12px;line-height:1.5;
    }
    .success{
      margin-top:12px;padding:12px 14px;border-radius:16px;
      background:rgba(49,209,124,.10);border:1px solid rgba(49,209,124,.22);
      color:#9cf0be;font-size:13px;font-weight:700;display:none;
    }
    .footer{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
    .hide{display:none!important}
    .logo img{width:72%;height:72%;object-fit:contain;display:block}
  &lt;/style&gt;
&lt;/head&gt;

&lt;title&gt;PREUVE — Accueil&lt;/title&gt;
&lt;style&gt;
:root{
  --bg1:#070b14; --bg2:#0d1322; --card1:rgba(20,24,36,.96); --card2:rgba(12,15,24,.96);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.12); --text:#f5f7fb; --muted:#9aa5bc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;SF Pro Text&quot;,Inter,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(77,163,255,.18), transparent 24%),
    radial-gradient(circle at top right, rgba(143,225,255,.08), transparent 20%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}
body{display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100dvh;padding:12px 14px 24px}
.status{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 14px;font-size:18px;font-weight:800}
.shell{
  min-height:calc(100dvh - 68px);
  border-radius:34px;padding:14px;
  background:linear-gradient(180deg, rgba(18,20,28,.97), rgba(12,14,20,.97));
  border:1px solid var(--line);
  box-shadow:0 18px 55px rgba(0,0,0,.42);
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  font-weight:900;font-size:26px;color:#04111f;
  background:linear-gradient(145deg,#e6c77a,#4da3ff 48%,#2d6eff);
  box-shadow:0 10px 30px rgba(77,163,255,.30);
}
.brand strong{display:block;font-size:22px}
.brand span{display:block;font-size:12px;color:var(--muted)}
.user{
  padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-size:12px;font-weight:800;
}
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 85% 12%, rgba(110,231,255,.20), transparent 25%),
    linear-gradient(180deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:28px;padding:20px;margin-bottom:16px;
}
.hero:after{
  content:&quot;&quot;;position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:999px;
  background:radial-gradient(circle, rgba(77,163,255,.25), transparent 70%);
}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.1}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:300px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-badges span{
  padding:8px 10px;border-radius:999px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);font-size:12px;font-weight:700;color:#dbe7fb;
}
.cards{display:grid;gap:14px}
.card{
  background:linear-gradient(180deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:24px;padding:18px;cursor:pointer;
}
.icon{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  margin-bottom:12px;font-size:20px;font-weight:900;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);
}
.card h2{margin:0 0 6px;font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.footer{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
.logo img{width:72%;height:72%;object-fit:contain;display:block}
&lt;/style&gt;

  &lt;style&gt;
    :root{
      --line:rgba(255,255,255,.08);
      --line2:rgba(255,255,255,.12);
      --text:#f5f7fb;
      --muted:#98a0b3;
      --blue:#4da3ff;
      --blue2:#c8a95b;
      --green:#31d17c;
      --bg1:#090a0f;
      --bg2:#0d0f15;
      --card1:rgba(22,24,34,.96);
      --card2:rgba(15,17,24,.96);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;height:100%;
      font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;SF Pro Text&quot;,Inter,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(77,163,255,.18), transparent 26%),
        radial-gradient(circle at top right, rgba(110,231,255,.10), transparent 22%),
        linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 46%, #0a0c12 100%);
      overflow-x:hidden;
    }
    body{display:flex;justify-content:center}
    .app{width:100%;max-width:430px;min-height:100dvh;padding:12px 14px 40px}
    .status{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 14px;font-size:18px;font-weight:700}
    .device{
      border-radius:34px;padding:14px;
      background:linear-gradient(180deg, rgba(18,20,28,.97), rgba(12,14,20,.97));
      border:1px solid var(--line);
      box-shadow:0 18px 55px rgba(0,0,0,.42);
      animation:deviceIn .9s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes deviceIn{
      0%{opacity:0;transform:translateY(26px) scale(.97)}
      60%{opacity:1;transform:translateY(-6px) scale(1.01)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px;}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:22px;color:#04111f;
      background:linear-gradient(145deg,#e6c77a,#4da3ff 48%,#2d6eff);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 10px 30px rgba(77,163,255,.25), 0 0 24px rgba(200,169,91,.25);
      position:relative;overflow:hidden;
    }
    .logo::after{
      content:&quot;&quot;;position:absolute;top:-30%;left:-120%;width:80%;height:160%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
      transform:skewX(-20deg);animation:logoShine 2.8s linear infinite;
    }
    @keyframes logoShine{0%{left:-120%}100%{left:140%}}
    .brand strong{display:block;font-size:18px}
    .brand .slogan{font-size:12px;color:var(--muted);margin-top:2px}
    .ghost-pill{
      padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);
      border:1px solid var(--line);color:#cad3e6;font-size:12px;font-weight:700;
    }
    .progress-card,.step{
      margin-top:14px;padding:16px;border-radius:28px;
      background:linear-gradient(180deg, var(--card1), var(--card2));
      border:1px solid var(--line);box-shadow:0 18px 55px rgba(0,0,0,.22);
      animation:cardShow .55s ease forwards;
    }
    @keyframes cardShow{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .progress-title{font-weight:700}
    .small{font-size:13px;color:var(--muted)}
    .progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
    .bar.active::after{content:&quot;&quot;;position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,#4da3ff,#c8a95b)}
    .step h2{margin:0 0 6px;font-size:24px}
    .muted{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45}
    .grid{display:grid;gap:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:12px;font-weight:700;color:#cfd6e7;margin:0 0 7px}
    input,textarea{
      width:100%;padding:15px;border-radius:18px;border:1px solid var(--line2);
      background:rgba(255,255,255,.04);color:var(--text);font-size:15px;outline:none;
    }
    input::placeholder,textarea::placeholder{color:#7f889d}
    textarea{min-height:118px;resize:none}
    .primary,.secondary{
      width:100%;border:none;border-radius:18px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer;
      position:relative;overflow:hidden;
    }
    .primary{color:#07111d;background:linear-gradient(135deg,#eef7ff,#8ad8ff 35%, #4da3ff 72%);box-shadow:0 16px 28px rgba(77,163,255,.24)}
    .secondary{margin-top:10px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line)}
    .sig-card{padding:14px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
    .sig-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .link-btn{border:none;background:none;padding:0;color:#8bc3ff;font-weight:700;font-size:13px}
    canvas{width:100%;height:132px;display:block;border-radius:18px;background:#ffffff;border:1px dashed rgba(0,0,0,.12)}
    .success{text-align:center;padding-top:24px}
    .badge{
      width:76px;height:76px;margin:0 auto 14px;border-radius:999px;display:grid;place-items:center;
      background:linear-gradient(180deg,#55ec98,#31d17c);color:#06120b;font-size:32px;font-weight:900;
      box-shadow:0 16px 34px rgba(49,209,124,.22)
    }
    .proof-card{
      margin-top:16px;padding:16px;border-radius:24px;background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.025));
      border:1px solid var(--line);text-align:left;
    }
    .proof-row{
      display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);align-items:start;
    }
    .proof-row:last-child{border-bottom:none}
    .proof-label{color:var(--muted);font-weight:600}
    .proof-value{font-weight:700;text-align:right;word-break:break-word}
    .proof-value.multiline{text-align:left;line-height:1.5;font-weight:600}
    .signatures-grid,.photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
    .sig-preview-card,.photo-card{
      border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03);padding:10px
    }
    .sig-preview-title,.photo-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
    .sig-preview,.photo-preview{
      width:100%;height:88px;object-fit:cover;border-radius:14px;background:#fff
    }
    .footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 8px}
    .hide{display:none}
    .loc-box,.upload-box{
      padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
    }
    .loc-status{font-size:13px;color:#cfd6e7;margin-top:8px;line-height:1.4}
    .file-input{padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--line2)}
  
    .validation-box{
      margin-top:14px;padding:14px;border-radius:18px;
      background:rgba(255,255,255,.03);border:1px solid var(--line);
      text-align:left;
    }
    .validation-status{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800;
      margin-bottom:10px;
    }
    .validation-status.pending{background:rgba(255,184,77,.14);color:#ffd38a;border:1px solid rgba(255,184,77,.22)}
    .validation-status.confirmed{background:rgba(49,209,124,.14);color:#8cf0b4;border:1px solid rgba(49,209,124,.22)}
.logo img{width:72%;height:72%;object-fit:contain;display:block}

&lt;/style&gt;
&lt;/head&gt;

&lt;style&gt;
:root{--bg1:#070b14;--bg2:#0d1322;--card:rgba(20,24,36,.95);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#9aa5bc}
body{margin:0;font-family:-apple-system,Arial;color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.container{max-width:420px;margin:auto;padding:20px}
.header{margin-bottom:20px}
.header h1{margin:0;font-size:24px}
.header p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px;margin-bottom:12px;position:relative}
.card.locked{opacity:.5}
.logo img{width:72%;height:72%;object-fit:contain;display:block}
.card.clickable{cursor:pointer}
.title{font-weight:bold;margin-bottom:5px}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:10px;margin-top:10px}
button{flex:1;padding:10px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.delete{background:#1f2937;color:white}
.unlock{background:linear-gradient(135deg,#8ad8ff,#4da3ff);color:#07111d}
.empty{background:var(--card);border:1px solid var(--line);padding:20px;border-radius:18px;color:var(--muted);text-align:center}
.counter{margin:12px 0 18px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;color:#dbe5f4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:999}
.overlay.show{display:flex}
.viewer{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:18px;max-height:85vh;overflow:auto}
.viewer h2{margin:0 0 8px;font-size:22px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.label{color:var(--muted);font-weight:700;font-size:13px}
.value{font-weight:700;font-size:14px;word-break:break-word}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.photos img{width:100%;height:100px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.close{width:100%;margin-top:14px;background:linear-gradient(135deg,#8ad8ff,#4da3ff);color:#07111d}
.note{margin-top:10px;color:var(--muted);font-size:12px}
&lt;/style&gt;

    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;label&quot;&gt;Accord&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;vAccord&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;label&quot;&gt;Montant&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;vMontant&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;label&quot;&gt;Date&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;vDate&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;label&quot;&gt;Date limite&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;vDateLimite&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;label&quot;&gt;Ville&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;vVille&quot;&gt;—&lt;/div&gt;&lt;/div&gt;
    &lt;div id=&quot;photosWrap&quot; class=&quot;hide&quot;&gt;
      &lt;div class=&quot;note&quot;&gt;Photos&lt;/div&gt;
      &lt;div class=&quot;photos&quot; id=&quot;photos&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;Les preuves verrouillées ne peuvent pas être rouvertes dans la version gratuite.&lt;/div&gt;
    &lt;button class=&quot;close&quot; onclick=&quot;closeViewer()&quot;&gt;Fermer&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
function load(){
  const data = JSON.parse(parent.localStorage.getItem(&quot;preuves&quot;) || &quot;[]&quot;);
  const list = document.getElementById(&quot;list&quot;);
  const counter = document.getElementById(&quot;counter&quot;);
  list.innerHTML = &quot;&quot;;

  if(data.length &lt;= 5){
    counter.textContent = data.length + &quot; / 5 preuves visibles&quot;;
  } else {
    counter.textContent = data.length + &quot; preuves enregistrées • certaines sont verrouillées&quot;;
  }

  if(!data.length){
    list.innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;Aucune preuve enregistrée pour le moment.&lt;/div&gt;&#x27;;
    return;
  }

  data.forEach((p,i)=&gt;{
    const div = document.createElement(&quot;div&quot;);
    div.className = &quot;card &quot; + (i&gt;=5 ? &quot;locked&quot; : &quot;clickable&quot;);
    div.innerHTML = `
      ${i&gt;=5 ? &quot;&lt;div style=&#x27;position:absolute;top:10px;right:10px;font-size:12px;background:rgba(255,255,255,.05);padding:5px 8px;border-radius:8px;&#x27;&gt;🔒 Verrouillé&lt;/div&gt;&quot; : &quot;&quot;}
      &lt;div class=&quot;title&quot;&gt;${p.partie1 || &quot;—&quot;} ↔ ${p.partie2 || &quot;—&quot;}&lt;/div&gt;
      &lt;div class=&quot;small&quot;&gt;${p.accord || &quot;Sans description&quot;}&lt;/div&gt;
      &lt;div class=&quot;small&quot;&gt;${p.date || &quot;&quot;}&lt;/div&gt;
      &lt;div class=&quot;small&quot;&gt;${p.montant ? &quot;Montant : &quot; + p.montant : &quot;&quot;}${p.ville ? &quot; • &quot; + p.ville : &quot;&quot;}&lt;/div&gt;
      &lt;div class=&quot;actions&quot;&gt;
        &lt;button class=&quot;delete&quot; onclick=&quot;event.stopPropagation(); delProof(${i})&quot;&gt;Supprimer&lt;/button&gt;
        ${i&gt;=5 ? &quot;&lt;button class=&#x27;unlock&#x27;&gt;Débloquer&lt;/button&gt;&quot; : &quot;&quot;}
      &lt;/div&gt;
    `;
    if(i &lt; 5){
      div.addEventListener(&#x27;click&#x27;, () =&gt; openViewer(p));
    }
    list.appendChild(div);
  });
}

function delProof(i){
  const data = JSON.parse(parent.localStorage.getItem(&quot;preuves&quot;) || &quot;[]&quot;);
  data.splice(i,1);
  parent.localStorage.setItem(&quot;preuves&quot;, JSON.stringify(data));
  load();
}

function openViewer(p){
  document.getElementById(&#x27;vP1&#x27;).textContent = p.partie1 || &quot;—&quot;;
  document.getElementById(&#x27;vP2&#x27;).textContent = p.partie2 || &quot;—&quot;;
  document.getElementById(&#x27;vAccord&#x27;).textContent = p.accord || &quot;—&quot;;
  document.getElementById(&#x27;vMontant&#x27;).textContent = p.montant || &quot;—&quot;;
  document.getElementById(&#x27;vDate&#x27;).textContent = p.date || &quot;—&quot;;
  document.getElementById(&#x27;vDateLimite&#x27;).textContent = p.dateLimite || &quot;—&quot;;
  document.getElementById(&#x27;vVille&#x27;).textContent = p.ville || &quot;—&quot;;

  const photosWrap = document.getElementById(&#x27;photosWrap&#x27;);
  const photos = document.getElementById(&#x27;photos&#x27;);
  photos.innerHTML = &#x27;&#x27;;
  if(Array.isArray(p.photos) &amp;&amp; p.photos.length){
    photosWrap.classList.remove(&#x27;hide&#x27;);
    p.photos.slice(0,4).forEach(src =&gt; {
      const img = document.createElement(&#x27;img&#x27;);
      img.src = src;
      img.alt = &#x27;Photo de preuve&#x27;;
      photos.appendChild(img);
    });
  } else {
    photosWrap.classList.add(&#x27;hide&#x27;);
  }

  document.getElementById(&#x27;overlay&#x27;).classList.add(&#x27;show&#x27;);
}

function closeViewer(){
  document.getElementById(&#x27;overlay&#x27;).classList.remove(&#x27;show&#x27;);
}

document.getElementById(&#x27;overlay&#x27;).addEventListener(&#x27;click&#x27;, function(e){
  if(e.target === this) closeViewer();
});

load();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
'></iframe></div>
  </div>

  <div class="nav hide" id="nav">
    <button id="navHome" onclick="showFrame('screen2')">Accueil</button>
    <button id="navCreate" onclick="showFrame('screen3')">Créer</button>
    <button id="navHistory" onclick="showFrame('screen4')">Historique</button>
  </div>
</div>

<script>
function showFrame(id){
  ['screen1','screen2','screen3','screen4'].forEach(s => {
    document.getElementById(s).classList.toggle('active', s===id);
  });
  const nav = document.getElementById('nav');
  nav.classList.toggle('hide', id==='screen1');
  document.getElementById('navHome').classList.toggle('active', id==='screen2');
  document.getElementById('navCreate').classList.toggle('active', id==='screen3');
  document.getElementById('navHistory').classList.toggle('active', id==='screen4');
}
window.showFrame = showFrame;

function boot(){
  const hasUser = !!localStorage.getItem('preuve_current_user');
  showFrame(hasUser ? 'screen2' : 'screen1');
}
boot();

setInterval(() => {
  const hasUser = !!localStorage.getItem('preuve_current_user');
  const onLogin = document.getElementById('screen1').classList.contains('active');
  if(hasUser && onLogin){
    showFrame('screen2');
  }
}, 500);
</script>
</body>
</html>
